<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-анализатор Avito XLSX</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-5">
      <div class="card app-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">AI-анализатор парсинга с Avito</h1>
            <form method="post" action="{{ url_for('logout') }}">
              <button class="btn btn-outline-secondary btn-sm" type="submit">Выйти</button>
            </form>
          </div>

          <form id="uploadForm" class="d-flex flex-column gap-3">
            <div>
              <label class="form-label" for="supplierId">Поставщик</label>
              <select class="form-select" id="supplierId" name="supplier_id" required>
                <option value="">Выберите поставщика</option>
              </select>
              <div class="form-text">Один файл = один поставщик. Выберите до начала анализа.</div>
            </div>

            <div class="border rounded p-3">
              <div class="fw-semibold mb-2">Добавить поставщика</div>
              <div class="row g-2 align-items-end">
                <div class="col-md-7">
                  <label class="form-label" for="newSupplierName">Имя</label>
                  <input class="form-control" id="newSupplierName" type="text" maxlength="100" />
                </div>
                <div class="col-md-2">
                  <label class="form-label" for="newSupplierLetter">Буква</label>
                  <input
                    class="form-control"
                    id="newSupplierLetter"
                    type="text"
                    maxlength="1"
                  />
                </div>
                <div class="col-md-3">
                  <button class="btn btn-outline-primary w-100" id="addSupplierBtn" type="button">
                    Добавить
                  </button>
                </div>
              </div>
              <div id="supplierFormError" class="text-danger small mt-2 d-none"></div>
            </div>

            <input
              class="form-control"
              type="file"
              name="file"
              id="fileInput"
              accept=".xlsx"
              required
            />
            <button class="btn btn-primary" id="uploadBtn" type="submit" disabled>
              Загрузить и анализировать
            </button>
          </form>

          <div id="statusBox" class="alert alert-light mt-4 mb-3" role="status">
            Статус: ожидание загрузки файла.
          </div>

          <div class="progress mb-3" role="progressbar">
            <div id="progressBar" class="progress-bar" style="width: 0%">0%</div>
          </div>

          <a id="downloadBtn" class="btn btn-success disabled" href="#" aria-disabled="true">
            Скачать результат
          </a>
        </div>
      </div>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
