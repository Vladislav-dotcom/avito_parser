# Внутри server { } добавьте строку:
#   include /etc/nginx/snippets/avito-parser-github-hook.conf;
# Затем: sudo nginx -t && sudo systemctl reload nginx
#
# GitHub → Webhooks → Payload URL (со слэшем):
#   http://37.230.116.197/hooks/avito-parser/
# Content type: application/json
# Events: Just the push event

location /hooks/avito-parser/ {
    proxy_pass http://127.0.0.1:9848/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_request_buffering off;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}
